<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎄 圣诞快乐 · Merry Christmas</title>
<style>
  :root{
    --red:#c62828; --deepred:#8e1b1b; --green:#1b5e20; --gold:#ffd54f;
    --cream:#fff8e7; --night:#0a1a2f;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(ellipse at 50% 0%,#123a5e 0%,var(--night) 55%,#050d1a 100%);
    color:var(--cream); overflow-x:hidden; min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
  }
  /* 星空粒子背景 */
  #sky{position:fixed;inset:0;z-index:0;pointer-events:none}
  .wrap{position:relative;z-index:1;width:100%;max-width:960px;padding:32px 20px 60px;text-align:center}

  h1{
    font-size:clamp(2rem,7vw,4rem);font-weight:800;letter-spacing:2px;
    background:linear-gradient(90deg,#ffd54f,#ff8a80,#ffd54f);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 30px rgba(255,213,79,.25);line-height:1.2;
  }
  .sub{margin-top:8px;font-size:clamp(.95rem,2.6vw,1.2rem);color:#dbe7f5;letter-spacing:4px}

  /* 圣诞树画布 */
  .tree-box{position:relative;margin:10px auto 4px;width:100%;max-width:520px}
  #tree{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 30px rgba(0,0,0,.5))}

  /* 控制条 */
  .controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px 0 26px}
  .btn{
    border:none;cursor:pointer;font-size:.95rem;font-weight:600;
    padding:10px 20px;border-radius:999px;color:#fff;
    background:linear-gradient(135deg,var(--green),#2e7d32);
    box-shadow:0 6px 18px rgba(0,0,0,.3);transition:transform .15s,filter .15s;
  }
  .btn:hover{transform:translateY(-2px);filter:brightness(1.12)}
  .btn.red{background:linear-gradient(135deg,var(--red),#e53935)}
  .btn.gold{background:linear-gradient(135deg,#b8860b,var(--gold));color:#3a2a00}

  /* 视频卡片 */
  .video-card{
    margin:0 auto;max-width:640px;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:14px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);backdrop-filter:blur(8px);
  }
  .video-card h2{font-size:1.15rem;margin-bottom:12px;color:var(--gold);letter-spacing:1px}
  .video-frame{
    position:relative;width:100%;aspect-ratio:9/16;max-height:70vh;
    border-radius:14px;overflow:hidden;background:#000;
  }
  video{width:100%;height:100%;object-fit:cover;display:block}
  .video-tip{font-size:.8rem;color:#a9bdd4;margin-top:10px}

  footer{margin-top:34px;font-size:.9rem;color:#9fb3ca;line-height:1.8}
  .heart{color:#ff6b6b}
  @media(min-width:760px){
    .stage{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
    .video-frame{max-height:none}
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div class="wrap">
  <h1>🎄 Merry Christmas 🎄</h1>
  <p class="sub">圣 诞 快 乐 · 愿 温 暖 与 你 相 伴</p>

  <div class="stage">
    <!-- 圣诞树动画 -->
    <div class="tree-box">
      <canvas id="tree" width="520" height="560"></canvas>
      <div class="controls">
        <button class="btn" id="toggleTree">⏸ 暂停动画</button>
        <button class="btn red" id="toggleSnow">❄ 飘雪开关</button>
        <button class="btn gold" id="toggleMusic">🎵 背景音乐</button>
      </div>
    </div>

    <!-- 在线视频 -->
    <div class="video-card">
      <h2>🎬 圣诞影像</h2>
      <div class="video-frame">
        <video id="xmasVideo" controls autoplay loop muted playsinline
               poster="">
          <source src="https://videos.pexels.com/video-files/6098619/6098619-hd_1080_1920_25fps.mp4" type="video/mp4">
          您的浏览器不支持视频播放。
        </video>
      </div>
      <p class="video-tip">视频来自 Pexels 免费素材 · 点击播放器可暂停/播放 · 若自动播放未生效，请点一下播放键 ▶</p>
    </div>
  </div>

  <footer>
    ✨ 愿这棵圣诞树为你点亮整个冬夜<br>
    <span class="heart">❤</span> Merry Christmas and a Happy New Year <span class="heart">❤</span>
  </footer>
</div>

<script>
/* ============ 星空飘雪背景 ============ */
const sky = document.getElementById('sky');
const sctx = sky.getContext('2d');
let flakes = [], snowOn = true, skyRAF;
function sizeSky(){
  sky.width = innerWidth; sky.height = innerHeight;
  flakes = Array.from({length: Math.min(160, Math.floor(innerWidth/8))}, () => ({
    x: Math.random()*sky.width, y: Math.random()*sky.height,
    r: Math.random()*2.2+0.6, s: Math.random()*0.8+0.25,
    drift: Math.random()*1.4-0.7, o: Math.random()*0.6+0.3
  }));
}
function drawSky(){
  sctx.clearRect(0,0,sky.width,sky.height);
  if(snowOn){
    for(const f of flakes){
      f.y += f.s; f.x += f.drift*0.3;
      if(f.y > sky.height+5){ f.y=-5; f.x=Math.random()*sky.width; }
      if(f.x > sky.width+5) f.x=-5; if(f.x < -5) f.x=sky.width+5;
      sctx.beginPath(); sctx.arc(f.x,f.y,f.r,0,Math.PI*2);
      sctx.fillStyle = `rgba(255,255,255,${f.o})`; sctx.fill();
    }
  }
  skyRAF = requestAnimationFrame(drawSky);
}
sizeSky(); drawSky();
addEventListener('resize', sizeSky);

/* ============ 圣诞树动画 ============ */
const tree = document.getElementById('tree');
const tctx = tree.getContext('2d');
const W = tree.width, H = tree.height;
let treeOn = true, treeRAF, frame = 0;

// 彩灯：挂在树上的点（相对树冠三角形分布）
const lights = [];
function buildLights(){
  lights.length = 0;
  const cx = W/2, topY = 100, bottomY = 440;
  // 沿三层三角形的边缘布置彩灯
  const layers = [
    {ty:110, by:250, hw:110},
    {ty:200, by:350, hw:150},
    {ty:290, by:450, hw:195}
  ];
  const palette = ['#ff5252','#ffd54f','#69f0ae','#40c4ff','#ff80ab'];
  for(const L of layers){
    const rows = 4;
    for(let i=1;i<=rows;i++){
      const y = L.ty + (L.by-L.ty)*(i/(rows+1));
      const hw = L.hw*(i/(rows+1));
      for(let side of [-1,1]){
        lights.push({
          x: cx + side*hw, y: y,
          color: palette[Math.floor(Math.random()*palette.length)],
          phase: Math.random()*Math.PI*2
        });
      }
    }
  }
  // 底部装饰球
  for(let i=0;i<7;i++){
    lights.push({
      x: cx-150+i*50, y: 452+Math.sin(i)*6,
      color: palette[i%palette.length], phase: Math.random()*Math.PI*2
    });
  }
}
buildLights();

function drawTree(){
  frame++;
  tctx.clearRect(0,0,W,H);
  const cx = W/2;

  // 树干
  tctx.fillStyle = '#6d4c41';
  tctx.fillRect(cx-18, 440, 36, 60);

  // 三层树冠
  const layers = [
    {ty:95,  by:255, hw:115},
    {ty:185, by:355, hw:158},
    {ty:275, by:460, hw:205}
  ];
  layers.forEach((L,idx)=>{
    const grad = tctx.createLinearGradient(cx-L.hw,0,cx+L.hw,0);
    grad.addColorStop(0,'#0e3d1f'); grad.addColorStop(.5,'#1b6b32'); grad.addColorStop(1,'#0e3d1f');
    tctx.beginPath();
    tctx.moveTo(cx, L.ty);
    tctx.lineTo(cx-L.hw, L.by);
    tctx.quadraticCurveTo(cx, L.by+18, cx+L.hw, L.by);
    tctx.closePath();
    tctx.fillStyle = grad; tctx.fill();
    // 积雪高光
    tctx.strokeStyle = 'rgba(255,255,255,.18)'; tctx.lineWidth=2; tctx.stroke();
  });

  // 顶部星星（闪烁）
  const twinkle = 0.6 + 0.4*Math.sin(frame*0.08);
  tctx.save();
  tctx.translate(cx, 78); tctx.rotate(frame*0.01);
  tctx.shadowColor = '#ffd54f'; tctx.shadowBlur = 25*twinkle;
  drawStar(tctx, 0, 0, 5, 26, 11);
  tctx.fillStyle = `rgba(255,213,79,${twinkle})`; tctx.fill();
  tctx.restore();

  // 彩灯闪烁
  for(const l of lights){
    const glow = 0.45 + 0.55*Math.abs(Math.sin(frame*0.05 + l.phase));
    tctx.beginPath(); tctx.arc(l.x,l.y,5,0,Math.PI*2);
    tctx.shadowColor = l.color; tctx.shadowBlur = 16*glow;
    tctx.fillStyle = l.color; tctx.globalAlpha = glow; tctx.fill();
    tctx.globalAlpha = 1; tctx.shadowBlur = 0;
  }
  // 地面雪堆
  tctx.beginPath(); tctx.ellipse(cx,500,230,22,0,0,Math.PI*2);
  tctx.fillStyle='rgba(255,255,255,.85)'; tctx.fill();

  if(treeOn) treeRAF = requestAnimationFrame(drawTree);
}
function drawStar(ctx,cx,cy,spikes,outer,inner){
  let rot=Math.PI/2*3, x=cx, y=cy, step=Math.PI/spikes;
  ctx.beginPath(); ctx.moveTo(cx,cy-outer);
  for(let i=0;i<spikes;i++){
    x=cx+Math.cos(rot)*outer; y=cy+Math.sin(rot)*outer; ctx.lineTo(x,y); rot+=step;
    x=cx+Math.cos(rot)*inner; y=cy+Math.sin(rot)*inner; ctx.lineTo(x,y); rot+=step;
  }
  ctx.closePath();
}
drawTree();

/* ============ 控制按钮 ============ */
document.getElementById('toggleTree').onclick = (e)=>{
  treeOn = !treeOn;
  e.target.textContent = treeOn ? '⏸ 暂停动画' : '▶ 继续动画';
  if(treeOn) drawTree(); else cancelAnimationFrame(treeRAF);
};
document.getElementById('toggleSnow').onclick = (e)=>{
  snowOn = !snowOn;
  e.target.textContent = snowOn ? '❄ 飘雪开' : '🌙 飘雪关';
};

/* ============ 简易背景音乐（Jingle Bells 片段，Web Audio 合成） ============ */
let audioCtx=null, musicOn=false, musicTimer=null, noteIdx=0;
const melody = [
  [659,1],[659,1],[659,2],[659,1],[659,1],[659,2],
  [659,1],[784,1],[523,1],[587,1],[659,4],
  [698,1],[698,1],[698,1],[698,1],[698,1],[659,1],[659,1],[659,1],
  [659,1],[587,1],[587,1],[659,1],[587,2],[784,2]
];
function playNote(freq,dur){
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type='triangle'; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.12,audioCtx.currentTime+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur*0.28);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+dur*0.3);
}
function scheduleMusic(){
  if(!musicOn) return;
  const [f,d]=melody[noteIdx%melody.length];
  playNote(f,d); noteIdx++;
  musicTimer=setTimeout(scheduleMusic, d*300);
}
document.getElementById('toggleMusic').onclick = (e)=>{
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  musicOn=!musicOn;
  if(musicOn){ audioCtx.resume(); noteIdx=0; scheduleMusic(); e.target.textContent='🎵 音乐开'; }
  else{ clearTimeout(musicTimer); e.target.textContent='🎵 背景音乐'; }
};

/* 页面离开时清理 */
addEventListener('beforeunload',()=>{cancelAnimationFrame(treeRAF);cancelAnimationFrame(skyRAF);clearTimeout(musicTimer);});
</script>
</body>
</html>
