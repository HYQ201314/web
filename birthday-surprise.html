<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>生日惊喜生成器 · Birthday Surprise</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;min-height:100%;background:#140b1e}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#fff;overflow-x:hidden;position:relative;
    background:radial-gradient(ellipse at 50% 0%,#2c1640 0%,#160c24 55%,#0b0713 100%);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:36px 18px;
  }
  #bg{position:fixed;inset:0;z-index:0;pointer-events:none}
  .wrap{position:relative;z-index:1;width:100%;max-width:520px}

  .card{
    background:rgba(30,18,46,.62);border:1px solid rgba(255,190,120,.22);
    border-radius:24px;padding:34px 30px 30px;
    box-shadow:0 24px 70px rgba(0,0,0,.5);backdrop-filter:blur(14px);
  }
  .badge{
    display:inline-block;font-size:11px;letter-spacing:.16em;color:#ffcf9a;
    border:1px solid rgba(255,180,110,.35);border-radius:999px;
    padding:5px 12px;margin-bottom:16px;
  }
  h1{
    font-size:clamp(1.6rem,6vw,2.3rem);font-weight:800;line-height:1.2;
    background:linear-gradient(90deg,#ffd98a,#ff7eb3,#ffd98a);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{margin-top:8px;font-size:.9rem;color:#cbb8e0;line-height:1.6}

  .field{margin-top:24px}
  label{display:block;font-size:.82rem;color:#f0c9a0;margin-bottom:8px;letter-spacing:.05em}
  input[type=text],textarea{
    width:100%;background:rgba(10,6,18,.55);border:1px solid rgba(255,190,120,.28);
    border-radius:12px;color:#fff;font-size:1rem;font-family:inherit;
    padding:12px 14px;outline:none;transition:border .2s,box-shadow .2s;
  }
  textarea{resize:vertical;min-height:66px;line-height:1.5}
  input[type=text]:focus,textarea:focus{
    border-color:rgba(255,180,100,.8);box-shadow:0 0 0 3px rgba(255,160,90,.14)
  }
  .themes{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
  .theme{
    width:34px;height:34px;border-radius:50%;cursor:pointer;
    border:2px solid transparent;transition:transform .15s,border .2s;
  }
  .theme:hover{transform:scale(1.12)}
  .theme.sel{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.18)}

  .gen{
    width:100%;margin-top:26px;border:none;cursor:pointer;
    font-size:1.02rem;font-weight:700;letter-spacing:.05em;color:#2a1206;
    padding:14px;border-radius:999px;
    background:linear-gradient(135deg,#ffd98a,#ff9a5a);
    box-shadow:0 10px 24px rgba(255,140,70,.28);
    transition:transform .15s,filter .15s;
  }
  .gen:hover{transform:translateY(-2px);filter:brightness(1.06)}
  .gen:active{transform:scale(.98)}

  .msg{
    margin-top:14px;font-size:.85rem;min-height:1.2em;text-align:center;
    color:#ffd7a8;transition:opacity .2s;
  }
  .msg.ok{color:#8ef0b8}
  .note{
    margin-top:20px;font-size:.74rem;color:#9c8ab5;line-height:1.7;
    border-top:1px dashed rgba(255,255,255,.1);padding-top:14px;
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="wrap">
  <div class="card">
    <span class="badge">🎂 100% 内嵌 · 离线可用</span>
    <h1>生日惊喜生成器</h1>
    <p class="sub">输入名字，一键生成专属生日祝福文件<br>下载后可离线打开，也能直接分享给朋友</p>

    <div class="field">
      <label for="name">寿星的名字</label>
      <input id="name" type="text" maxlength="20" placeholder="例如：小明" autocomplete="off" />
    </div>

    <div class="field">
      <label for="wish">祝福语（可选）</label>
      <textarea id="wish" maxlength="80" placeholder="愿你岁岁常欢愉，万事皆胜意"></textarea>
    </div>

    <div class="themes" id="themes">
      <div class="theme sel" data-color="#ff9a5a" title="暖橙" style="background:linear-gradient(135deg,#ffd98a,#ff7a3d)"></div>
      <div class="theme" data-color="#ff6fa5" title="玫瑰" style="background:linear-gradient(135deg,#ffb3d1,#ff4f8b)"></div>
      <div class="theme" data-color="#ffd56b" title="金黄" style="background:linear-gradient(135deg,#fff0b0,#f5b830)"></div>
      <div class="theme" data-color="#6fc4ff" title="星蓝" style="background:linear-gradient(135deg,#bfe6ff,#3d8fe6)"></div>
    </div>

    <button class="gen" id="gen">✨ 生成并下载专属生日文件</button>
    <div class="msg" id="msg"></div>

    <div class="note">
      生成的是一个独立的 HTML 文件（含动画与生日歌），全部资源内嵌，无需联网。<br>
      本页面在 GitHub Pages 子路径（/web/）下可正常运行。
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ============ 背景漂浮粒子 ============ */
var bg=document.getElementById('bg'), bx=bg.getContext('2d');
var BW=0,BH=0,parts=[];
function bgResize(){
  BW=bg.width=innerWidth; BH=bg.height=innerHeight;
  parts=[];
  var n=Math.min(90,Math.floor(BW/12));
  for(var i=0;i<n;i++)parts.push({
    x:Math.random()*BW,y:Math.random()*BH,
    r:Math.random()*2+0.6,v:Math.random()*0.5+0.15,
    d:Math.random()*0.5-0.25,a:Math.random()*0.5+0.2
  });
}
bgResize(); addEventListener('resize',bgResize);
function bgTick(){
  bx.clearRect(0,0,BW,BH);
  for(var i=0;i<parts.length;i++){
    var p=parts[i];p.y-=p.v;p.x+=p.d;
    if(p.y<-4){p.y=BH+4;p.x=Math.random()*BW;}
    bx.beginPath();bx.arc(p.x,p.y,p.r,0,Math.PI*2);
    bx.fillStyle='rgba(255,205,150,'+p.a+')';bx.fill();
  }
  requestAnimationFrame(bgTick);
}
bgTick();

/* ============ 工具 ============ */
function esc(s){
  return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ============ 生成的专属生日文件模板（全部内嵌，无外部链接） ============ */
/* 占位符：__NAME__ / __WISH__ / __THEME__；模板内部不使用反引号与 ${ } */
var CARD = [
'<!DOCTYPE html>',
'<html lang="zh-CN">',
'<head>',
'<meta charset="UTF-8">',
'<meta name="viewport" content="width=device-width,initial-scale=1">',
'<title>__NAME__ 的生日惊喜</title>',
'<style>',
'*{margin:0;padding:0;box-sizing:border-box}',
'html,body{width:100%;height:100%;overflow:hidden;background:#0d0616}',
'body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center}',
'#fx{position:fixed;inset:0;z-index:0}',
'.stage{position:relative;z-index:1;padding:20px;width:100%}',
'.eyebrow{font-size:clamp(.8rem,3vw,1rem);letter-spacing:.4em;color:__THEME__;opacity:.9}',
'.name{font-size:clamp(2.6rem,12vw,6rem);font-weight:900;line-height:1.15;margin:10px 0;background:linear-gradient(90deg,#fff2c8,__THEME__,#fff2c8);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px rgba(255,180,100,.25)}',
'.wish{font-size:clamp(1rem,4vw,1.4rem);color:#ffe6c8;margin:14px auto 0;max-width:32em;line-height:1.7}',
'.cake{position:relative;width:210px;height:132px;margin:0 auto 26px}',
'.plate{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:250px;height:16px;border-radius:50%;background:linear-gradient(#e8d6ff,#8a6fb0);box-shadow:0 8px 20px rgba(0,0,0,.4)}',
'.body{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:176px;height:76px;border-radius:10px 10px 8px 8px;background:linear-gradient(90deg,#f3c99a,#ffe6c2,#f3c99a);box-shadow:inset 0 -10px 0 rgba(0,0,0,.08)}',
'.drip{position:absolute;bottom:84px;left:50%;transform:translateX(-50%);width:190px;height:24px;border-radius:14px 14px 8px 8px;background:linear-gradient(90deg,__THEME__,#ffe9c8,__THEME__)}',
'.candle{position:absolute;bottom:100px;width:9px;height:40px;border-radius:3px;background:repeating-linear-gradient(45deg,#ff6b9a 0 7px,#fff 7px 14px)}',
'.flame{position:absolute;bottom:138px;width:16px;height:24px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff6b0,#ff9a3c 60%,rgba(255,120,40,0));transform-origin:50% 100%;animation:flick 1.1s infinite alternate;box-shadow:0 0 18px __THEME__}',
'@keyframes flick{from{transform:scale(1) rotate(-5deg)}to{transform:scale(1.12) rotate(6deg)}}',
'.play{margin-top:26px;border:1px solid rgba(255,200,140,.5);color:#ffe2bc;background:rgba(255,180,110,.12);border-radius:999px;padding:9px 20px;font-size:.9rem;cursor:pointer;font-family:inherit;transition:background .2s}',
'.play:hover{background:rgba(255,180,110,.25)}',
'.tag{margin-top:18px;font-size:.72rem;letter-spacing:.2em;color:#b79ad2;opacity:.7}',
'</style>',
'</head>',
'<body>',
'<canvas id="fx"></canvas>',
'<div class="stage">',
'<div class="eyebrow">HAPPY BIRTHDAY</div>',
'<div class="cake">',
'<div class="flame" style="left:calc(50% - 8px)"></div>',
'<div class="candle" style="left:calc(50% - 4.5px)"></div>',
'<div class="drip"></div>',
'<div class="body"></div>',
'<div class="plate"></div>',
'</div>',
'<div class="name">__NAME__</div>',
'<p class="wish">__WISH__</p>',
'<button class="play" id="play">🎵 点击播放生日歌</button>',
'<div class="tag">MADE WITH LOVE · 专属生日祝福</div>',
'</div>',
'<script>',
'(function(){',
'var c=document.getElementById("fx"),x=c.getContext("2d"),W,H;',
'function rz(){W=c.width=innerWidth;H=c.height=innerHeight;}',
'addEventListener("resize",rz);rz();',
'var ps=[];',
'function boom(px,py){',
'var hue=Math.random()*55+18;',
'for(var i=0;i<80;i++){',
'var a=Math.random()*Math.PI*2,s=Math.random()*5+1;',
'ps.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col:"hsl("+hue+",100%,68%)",sz:Math.random()*2.4+1});',
'}',
'}',
'function tick(){',
'x.globalCompositeOperation="source-over";',
'x.fillStyle="rgba(9,4,18,0.28)";x.fillRect(0,0,W,H);',
'x.globalCompositeOperation="lighter";',
'if(Math.random()<0.035)boom(Math.random()*W,Math.random()*H*0.75);',
'for(var i=ps.length-1;i>=0;i--){',
'var p=ps[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.vx*=0.99;p.life-=0.011;',
'if(p.life<=0){ps.splice(i,1);continue;}',
'x.globalAlpha=Math.max(0,p.life);x.fillStyle=p.col;',
'x.beginPath();x.arc(p.x,p.y,p.sz,0,Math.PI*2);x.fill();',
'}',
'x.globalAlpha=1;',
'requestAnimationFrame(tick);',
'}',
'tick();',
'var melody=[[392,1],[392,1],[440,2],[392,2],[523,2],[494,4],[392,1],[392,1],[440,2],[392,2],[587,2],[523,4],[392,1],[392,1],[784,2],[659,2],[523,2],[494,2],[440,4],[698,1],[698,1],[659,2],[523,2],[587,2],[523,4]];',
'var ac=null,timer=null,ni=0,playing=false;',
'function note(f,d){',
'var o=ac.createOscillator(),g=ac.createGain();',
'o.type="triangle";o.frequency.value=f;',
'g.gain.setValueAtTime(0.0001,ac.currentTime);',
'g.gain.exponentialRampToValueAtTime(0.14,ac.currentTime+0.02);',
'g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d*0.3);',
'o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d*0.32);',
'}',
'function schedule(){',
'if(!playing)return;',
'var m=melody[ni%melody.length];note(m[0],m[1]);ni++;',
'timer=setTimeout(schedule,m[1]*300);',
'}',
'document.getElementById("play").addEventListener("click",function(){',
'if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();',
'ac.resume();',
'if(playing){playing=false;clearTimeout(timer);this.textContent="🎵 点击播放生日歌";}',
'else{playing=true;ni=0;schedule();this.textContent="⏸ 暂停生日歌";}',
'});',
'})();',
'</'+'script>',
'</body>',
'</html>'
].join('\n');

/* ============ 生成 + 下载（Blob 方式，兼容子路径） ============ */
var nameEl=document.getElementById('name');
var wishEl=document.getElementById('wish');
var msgEl=document.getElementById('msg');
var theme='#ff9a5a';
var themeEls=document.querySelectorAll('.theme');
themeEls.forEach(function(t){
  t.addEventListener('click',function(){
    themeEls.forEach(function(e){e.classList.remove('sel')});
    t.classList.add('sel');theme=t.dataset.color;
  });
});

function safeFileName(s){
  return String(s).replace(/[\\/:*?"<>|]/g,'').slice(0,30)||'寿星';
}

function downloadFile(filename,content){
  var blob=new Blob([content],{type:'text/html;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download=filename;
  a.style.display='none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url)},1500);
}

document.getElementById('gen').addEventListener('click',function(){
  var name=nameEl.value.trim();
  if(!name){
    msgEl.className='msg';
    msgEl.textContent='请先输入寿星的名字 😊';
    nameEl.focus();
    return;
  }
  var wish=wishEl.value.trim()||'愿你岁岁常欢愉，万事皆胜意，生日快乐！';
  var html=CARD
    .replace(/__NAME__/g,esc(name))
    .replace(/__WISH__/g,esc(wish))
    .replace(/__THEME__/g,theme);
  var file=safeFileName(name)+'的生日惊喜.html';
  try{
    downloadFile(file,html);
    msgEl.className='msg ok';
    msgEl.textContent='✅ 已生成并下载：'+file;
  }catch(e){
    msgEl.className='msg';
    msgEl.textContent='下载失败：'+e.message;
  }
});

/* 回车快捷生成 */
nameEl.addEventListener('keydown',function(e){
  if(e.key==='Enter')document.getElementById('gen').click();
});

})();
</script>
</body>
</html>
